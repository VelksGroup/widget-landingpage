<!doctype html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; background: #0b1d2e; }

  .card {
    position: relative;
    width: 1600px;
    height: 1000px;
    background:
      linear-gradient(180deg, rgba(11,29,46,0) 0%, rgba(6,16,26,0.5) 100%),
      repeating-linear-gradient(0deg, rgba(180,210,230,0.07) 0px, rgba(180,210,230,0.07) 1px, transparent 1px, transparent 44px),
      repeating-linear-gradient(90deg, rgba(180,210,230,0.07) 0px, rgba(180,210,230,0.07) 1px, transparent 1px, transparent 44px),
      #0b1d2e;
  }

  .circuit { position: absolute; right: -40px; top: -20px; opacity: 0.9; }
  .circuit2 { position: absolute; left: -60px; bottom: -60px; opacity: 0.55; transform: scaleX(-1); }
</style>
</head>
<body>
  <div class="card">
    <svg class="circuit" width="800" height="620" viewBox="0 0 360 220" fill="none">
      <path d="M10 190 H120 V110 H230" stroke="rgba(234,242,248,0.35)" stroke-width="2.5" fill="none"/>
      <path d="M230 110 V40 H350" stroke="#e8a33d" stroke-width="2.5" fill="none"/>
      <circle cx="10" cy="190" r="6" fill="rgba(234,242,248,0.6)"/>
      <circle cx="230" cy="110" r="7" fill="#e8a33d"/>
      <circle cx="350" cy="40" r="6" fill="#e8a33d"/>
      <circle cx="350" cy="40" r="14" stroke="#e8a33d" stroke-width="1.5" fill="none" opacity="0.6"/>
    </svg>
    <svg class="circuit2" width="700" height="540" viewBox="0 0 360 220" fill="none">
      <path d="M10 190 H120 V110 H230" stroke="rgba(234,242,248,0.25)" stroke-width="2.5" fill="none"/>
      <path d="M230 110 V40 H350" stroke="rgba(232,163,61,0.6)" stroke-width="2.5" fill="none"/>
      <circle cx="230" cy="110" r="7" fill="rgba(232,163,61,0.6)"/>
    </svg>
  </div>
</body>
</html>
